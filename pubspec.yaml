name: tidy
description: "Tidy — clean, tune and reclaim your Mac."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.9+10

environment:
  sdk: ^3.7.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  cupertino_icons: ^1.0.8
  # Value equality for the growing set of bloc states — hand-written `==` across
  # a dozen state classes is a bug farm.
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  # Service locator. Seven modules with their own scanners means ~15 services,
  # and the menu-bar popover runs in a second Flutter engine that cannot see the
  # main window's BlocProvider — it needs its own registry regardless.
  get_it: ^8.0.3
  # Icon set. Material's glyphs are inconsistent in weight and read as
  # "generic Android app" on macOS; HugeIcons is a single stroke-weight family.
  # Routing. StatefulShellRoute.indexedStack specifically: it gives real
  # routes while keeping each module's state alive, so navigating away from
  # a running scan does not kill it.
  go_router: ^14.6.2
  hugeicons: ^0.0.11
  path: ^1.9.0
  # The local history store. Tidy used to forget everything it did — every
  # outcome lived for one bloc emission — so "how much have I reclaimed this
  # month?" was unanswerable. Per-file removal records over years is a row count
  # a single JSON blob cannot carry.
  #
  # Hive rather than sqlite3: sqlite3 needs a native library on every platform,
  # and on macOS that meant building the whole SQLite amalgamation through
  # CocoaPods — thousands of warnings, minutes of build time, and a release
  # `.app` that only worked once the right pod happened to be linked. Hive is
  # pure Dart with no platform side at all, so the desktop build has nothing
  # left to get wrong. The cost is that queries are Dart rather than SQL; see
  # `lib/core/store/tidy_store.dart` for what that means in practice.
  hive: ^2.2.3
  # The landing page's release lookup. `core/updates/github_release_client.dart`
  # already does this for the app, but on `dart:io`'s HttpClient, which does not
  # compile for web. Imported only from `lib/landing/`, so it is tree-shaken out
  # of the macOS bundle.
  http: ^1.2.2
  logger: ^2.7.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  # Icon and splash generators. Build-time only — they write into the platform
  # folders and ship nothing into the app.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# ─── App icon ───────────────────────────────────────────────────────────────
# Regenerate with: dart run flutter_launcher_icons
#
# The sources under `assets/icon/` are themselves generated — run
# `python3 scripts/generate_icons.py` first if the mark changes.
#
# Prod only. `flutter_launcher_icons` knows about one icon per platform, so the
# dev flavour's macOS set is written directly into
# `macos/Runner/Assets.xcassets/AppIcon-dev.appiconset` by that same script,
# and `dart run flutter_launcher_icons` leaves it alone.
#
# Three source images rather than one, because the platforms want genuinely
# different things: iOS/web/Android-legacy mask the icon themselves and need it
# edge to edge, macOS and Windows want the tile drawn inside the canvas with its
# own margin and shadow, and Android's adaptive foreground is the glyph alone
# inside the 66% safe zone.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"

  android: true
  adaptive_icon_background: "#5B45E0"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

  ios: true
  # The App Store rejects an icon with an alpha channel, and the full-bleed
  # source has none — this is belt and braces.
  remove_alpha_ios: true

  macos:
    generate: true
    image_path: "assets/icon/app_icon_macos.png"

  windows:
    generate: true
    image_path: "assets/icon/app_icon_macos.png"
    icon_size: 256

  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#15112E"
    theme_color: "#5B45E0"

# ─── Splash screen ──────────────────────────────────────────────────────────
# Regenerate with: dart run flutter_native_splash:create
#
# Android, iOS and web only: those embedders show a native launch screen that
# hands over to the first Flutter frame. The desktop embedders have no
# equivalent, so macOS/Windows/Linux are covered by `SplashGate` in Dart
# instead — see lib/features/splash/presentation/splash_gate.dart.
#
# The colours are the app's own canvas tokens (`AppColorTokens.canvas`), so the
# launch screen and the first painted frame are the same colour and the
# handover is invisible.
flutter_native_splash:
  color: "#F3F1FD"
  color_dark: "#15112E"
  image: "assets/icon/splash_mark.png"

  android: true
  ios: true
  # Off, because `web/index.html` is hand-written for the landing page — a boot
  # curtain, the Open Graph head, and a `<noscript>` block a crawler can read.
  # `flutter_native_splash:create` rewrites that file wholesale, so leaving this
  # on would silently throw the marketing site's head away on the next run.
  web: false

  # Android 12+ ignores the classic splash entirely and draws its own masked
  # icon on a solid background, so it needs its own, larger source.
  android_12:
    image: "assets/icon/splash_mark_android12.png"
    color: "#F3F1FD"
    color_dark: "#15112E"
    icon_background_color: "#F3F1FD"
    icon_background_color_dark: "#15112E"
