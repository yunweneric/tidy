name: Deploy landing page

on:
  push:
    branches:
      - main
    paths:
      - "lib/landing/**"
      - "lib/main_landing.dart"
      # The page is built out of the app's own design system, widget library,
      # navigation model and menu bar components, so a token, a module or a
      # popover row changing is a reason to redeploy.
      - "lib/core/**"
      - "lib/features/shell/domain/**"
      - "lib/features/menubar/presentation/widgets/**"
      - "web/**"
      - "pubspec.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch: # Allow manual triggering

# Pages only ever serves one version; a queued deploy supersedes a running one
# rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve Flutter version
        id: meta
        run: |
          set -euo pipefail
          # Same source of truth as ci.yml: .fvmrc pins the SDK for the project.
          if [ -f ".fvmrc" ]; then
            FLUTTER_VERSION=$(grep -o '"flutter"[[:space:]]*:[[:space:]]*"[^"]*"' .fvmrc | cut -d'"' -f4)
          fi
          echo "flutter_version=${FLUTTER_VERSION:-3.38.10}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.meta.outputs.flutter_version }}
          channel: stable
          cache: true

      # A custom domain serves the site from the root; a bare project page
      # serves it from /<repo>/. Getting this wrong 404s every asset —
      # including flutter_bootstrap.js, which leaves the page stuck on its
      # boot curtain — so it is derived rather than hard-coded.
      - name: Resolve base href
        id: site
        run: |
          set -euo pipefail
          if [ -f "web/CNAME" ]; then
            DOMAIN=$(tr -d '[:space:]' < web/CNAME)
            echo "base_href=/" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${DOMAIN}/" >> "$GITHUB_OUTPUT"
            echo "Custom domain: ${DOMAIN} — base href /"
          else
            echo "base_href=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
            echo "Project page — base href /${{ github.event.repository.name }}/"
          fi

      - name: Get dependencies
        run: flutter pub get

      # Scoped to what this workflow actually compiles. `lib/main.dart` pulls in
      # the whole macOS product — platform channels, the Hive store, the
      # updater — none of which this bundle contains, and a failure over there
      # should not stop the marketing site deploying.
      - name: Analyze landing page
        run: flutter analyze lib/landing lib/main_landing.dart

      # `--wasm` compiles to WasmGC and renders with skwasm, and emits the
      # dart2js + CanvasKit build alongside it as the fallback — the loader
      # picks per browser. It is both faster to run and about a third lighter
      # over the wire than the JavaScript path on its own.
      - name: Build landing page
        run: |
          flutter build web \
            --wasm \
            --release \
            --target lib/main_landing.dart \
            --base-href "${{ steps.site.outputs.base_href }}" \
            --pwa-strategy none

      # Written here rather than committed so <lastmod> is a fact instead of a
      # date somebody remembered to bump — a lastmod a crawler decides it cannot
      # trust is worse than none at all. The workflow only runs when the page
      # itself changed, so the head commit's date is the page's date.
      - name: Write sitemap
        env:
          SITE_URL: ${{ steps.site.outputs.site_url }}
        run: |
          set -euo pipefail
          LASTMOD=$(git log -1 --format=%cs)
          cat > build/web/sitemap.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>${SITE_URL}</loc>
              <lastmod>${LASTMOD}</lastmod>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          XML
          cat build/web/sitemap.xml

      # robots.txt names the sitemap by absolute URL, and index.html carries an
      # absolute canonical. Both are wrong on a project page, so they are only
      # true when the custom domain is what actually serves the site.
      - name: Check the deployed origin matches the absolute URLs
        env:
          SITE_URL: ${{ steps.site.outputs.site_url }}
        run: |
          set -euo pipefail
          grep -q "${SITE_URL}sitemap.xml" build/web/robots.txt \
            || echo "::warning::robots.txt points at a different origin than ${SITE_URL}"
          grep -q "rel=\"canonical\" href=\"${SITE_URL}\"" build/web/index.html \
            || echo "::warning::The canonical URL in index.html is not ${SITE_URL}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
