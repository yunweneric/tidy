name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allow manual triggering

# Only keep the latest run per ref; releases are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write # required to create GitHub Releases

jobs:
  prepare:
    name: Resolve build metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      flutter_version: ${{ steps.meta.outputs.flutter_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version and Flutter SDK
        id: meta
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Flutter SDK version: .fvmrc is the source of truth for the project.
          if [ -f ".fvmrc" ]; then
            FLUTTER_VERSION=$(grep -o '"flutter"[[:space:]]*:[[:space:]]*"[^"]*"' .fvmrc | cut -d'"' -f4)
          fi
          FLUTTER_VERSION="${FLUTTER_VERSION:-3.38.10}"

          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)

          # A tag is the release version and must match what pubspec ships:
          # the updater compares the tag against the running app's
          # CFBundleShortVersionString, which comes from pubspec.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
            if [ "${VERSION}" != "${PUBSPEC_VERSION}" ]; then
              echo "::error::Tag ${VERSION} does not match pubspec version ${PUBSPEC_VERSION}."
              exit 1
            fi
          else
            VERSION="${PUBSPEC_VERSION}-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi

          {
            echo "version=${VERSION}"
            echo "flutter_version=${FLUTTER_VERSION}"
          } >> "$GITHUB_OUTPUT"

          echo "Version: ${VERSION} | Flutter: ${FLUTTER_VERSION}"

  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.prepare.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      # Tidy has no Dart tests yet; `flutter test` fails outright on a missing
      # test/ directory, so the step waits for one to exist instead of being a
      # permanent red X.
      - name: Run tests
        run: |
          set -euo pipefail
          if [ -d test ]; then
            flutter test
          else
            echo "No test/ directory — skipping."
          fi

  build-macos:
    name: Build macOS app
    runs-on: macos-latest
    needs: [prepare, verify]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.prepare.outputs.flutter_version }}
          channel: stable
          cache: true

      # The same script a developer runs locally, so a CI artifact and a
      # hand-built one are the same thing: ad-hoc signed, never notarized.
      - name: Build & package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: ./scripts/build_dmg.sh --zip --version "$VERSION" --output-dir build/dist

      # The updater reads a digest out of SHA256SUMS.txt rather than trusting
      # GitHub's asset `digest`, which is only recorded for recent uploads. It
      # is also the only integrity check an unsigned build gets, so the release
      # is worthless to the updater without it.
      - name: Generate checksums
        working-directory: build/dist
        run: |
          set -euo pipefail
          shasum -a 256 *.zip *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tidy-macos
          path: build/dist/*
          retention-days: 90
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR dist

      - name: Compose release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "## 🧹 Tidy ${TAG}"
            echo ""
            echo "| Download | For |"
            echo "| --- | --- |"
            echo "| \`Tidy-${VERSION}.dmg\` | A first install — drag Tidy to Applications |"
            echo "| \`Tidy-${VERSION}-macos.zip\` | What the in-app updater downloads |"
            echo ""
            echo "> **Unsigned build.** Tidy is not signed with a Developer ID and not"
            echo "> notarized, so the first launch is blocked: open **System Settings →"
            echo "> Privacy & Security** and choose **Open Anyway** (right-click → Open no"
            echo "> longer bypasses Gatekeeper on macOS 15+). Updates are verified against"
            echo "> the SHA-256 digest published below rather than a code signature."
            echo ""
            echo "Tidy runs outside the App Sandbox so it can inspect \`/Applications\`"
            echo "and \`~/Library\`. Grant it **Full Disk Access** in System Settings and"
            echo "relaunch — macOS caches that decision per process, so the grant only"
            echo "takes effect after a restart of the app."
            echo ""
            echo "Verify your download against \`SHA256SUMS.txt\`:"
            echo "\`shasum -a 256 -c SHA256SUMS.txt --ignore-missing\`"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Tidy ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/**/*
          # Appends the commit/PR changelog under the body above, so the notes
          # stop pointing at the commit history and just carry it.
          generate_release_notes: true
          draft: false
          # A prerelease is invisible to the updater unless the app was built
          # with TIDY_UPDATE_PRERELEASE=true, so shipping one by accident would
          # look like the release simply never arrived.
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Build summary
    runs-on: ubuntu-latest
    needs: [prepare, build-macos]
    if: always()
    steps:
      - name: Write summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
        run: |
          {
            echo "## 🧹 Tidy — \`${VERSION}\`"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Build | ${MACOS_RESULT} |"
            echo "| Signing | ad-hoc (unsigned, not notarized) |"
            echo ""
            echo "> 💡 Actions tab → this run → **Artifacts** to download the DMG."
          } >> "$GITHUB_STEP_SUMMARY"
