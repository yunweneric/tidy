name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allow manual triggering

# Only keep the latest run per ref; releases are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write # required to create GitHub Releases

jobs:
  prepare:
    name: Resolve build metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      flutter_version: ${{ steps.meta.outputs.flutter_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve version and Flutter SDK
        id: meta
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Flutter SDK version: .fvmrc is the source of truth for the project.
          if [ -f ".fvmrc" ]; then
            FLUTTER_VERSION=$(grep -o '"flutter"[[:space:]]*:[[:space:]]*"[^"]*"' .fvmrc | cut -d'"' -f4)
          fi
          FLUTTER_VERSION="${FLUTTER_VERSION:-3.38.10}"

          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)

          # A tag is the release version and must match what pubspec ships:
          # the updater compares the tag against the running app's
          # CFBundleShortVersionString, which comes from pubspec.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
            if [ "${VERSION}" != "${PUBSPEC_VERSION}" ]; then
              echo "::error::Tag ${VERSION} does not match pubspec version ${PUBSPEC_VERSION}."
              exit 1
            fi
          else
            VERSION="${PUBSPEC_VERSION}-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi

          {
            echo "version=${VERSION}"
            echo "flutter_version=${FLUTTER_VERSION}"
          } >> "$GITHUB_OUTPUT"

          echo "Version: ${VERSION} | Flutter: ${FLUTTER_VERSION}"

  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.prepare.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      # Tidy has no Dart tests yet; `flutter test` fails outright on a missing
      # test/ directory, so the step waits for one to exist instead of being a
      # permanent red X.
      - name: Run tests
        run: |
          set -euo pipefail
          if [ -d test ]; then
            flutter test
          else
            echo "No test/ directory — skipping."
          fi

  build-macos:
    name: Build macOS app
    runs-on: macos-latest
    needs: [prepare, verify]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.prepare.outputs.flutter_version }}
          channel: stable
          cache: true

      # The same script a developer runs locally, so a CI artifact and a
      # hand-built one are the same thing: ad-hoc signed, never notarized.
      - name: Build & package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: ./scripts/build_dmg.sh --zip --version "$VERSION" --output-dir build/dist

      # The updater reads a digest out of SHA256SUMS.txt rather than trusting
      # GitHub's asset `digest`, which is only recorded for recent uploads. It
      # is also the only integrity check an unsigned build gets, so the release
      # is worthless to the updater without it.
      - name: Generate checksums
        working-directory: build/dist
        run: |
          set -euo pipefail
          shasum -a 256 *.zip *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: tidy-macos
          path: build/dist/*
          retention-days: 90
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # The changelog is read out of the log, so this job needs the history
      # and the tags — the other jobs do not, and take the default shallow
      # clone.
      - name: Check out history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR dist

      - name: Compose release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          # The previous release: the highest version among the tags that are
          # actually ancestors of this one.
          #
          # `--merged` rather than a plain version sort, so a patch cut from an
          # older branch diffs against its own ancestor instead of against
          # whatever number happens to sort highest. And a version sort rather
          # than `git describe`, which returns whichever tag it finds first
          # when several sit on one commit — v1.0.1 and v1.0.2 both point at
          # `5226c05`, and describe answered v1.0.1.
          #
          # `v[0-9]*` skips the two malformed legacy tags, `v.1.0.0` and
          # `v.1.0.1`.
          PREV=$(git tag --list 'v[0-9]*' --sort=-v:refname --merged "${TAG}^" 2>/dev/null | head -n 1 || true)

          if [ -n "${PREV}" ]; then
            RANGE="${PREV}..${TAG}"
          else
            RANGE="${TAG}"
          fi

          # Oldest first, so the list reads as the order things happened in.
          git log --no-merges --reverse \
            --pretty=format:"- %s ([\`%h\`](${REPO_URL}/commit/%H))" \
            "${RANGE}" > changelog.md
          printf '\n' >> changelog.md

          COUNT=$(grep -c '^- ' changelog.md || true)
          echo "::notice::${COUNT} commit(s) in ${RANGE}"

          {
            echo "## 🧹 Tidy ${TAG}"
            echo ""
            echo "| Download | For |"
            echo "| --- | --- |"
            echo "| \`Tidy-${VERSION}.dmg\` | A first install — drag Tidy to Applications |"
            echo "| \`Tidy-${VERSION}-macos.zip\` | What the in-app updater downloads |"
            echo ""
            echo "> **Unsigned build.** Tidy is not signed with a Developer ID and not"
            echo "> notarized, so the first launch is blocked: open **System Settings →"
            echo "> Privacy & Security** and choose **Open Anyway** (right-click → Open no"
            echo "> longer bypasses Gatekeeper on macOS 15+). Updates are verified against"
            echo "> the SHA-256 digest published below rather than a code signature."
            echo ""
            echo "Tidy runs outside the App Sandbox so it can inspect \`/Applications\`"
            echo "and \`~/Library\`. Grant it **Full Disk Access** in System Settings and"
            echo "relaunch — macOS caches that decision per process, so the grant only"
            echo "takes effect after a restart of the app."
            echo ""
            echo "Verify your download against \`SHA256SUMS.txt\`:"
            echo "\`shasum -a 256 -c SHA256SUMS.txt --ignore-missing\`"
            echo ""
            echo "---"
            echo ""

            if [ "${COUNT}" -eq 0 ]; then
              echo "### What changed"
              echo ""
              echo "Nothing since \`${PREV:-the first commit}\` — this tag points at the"
              echo "same tree, and was cut to re-run the release."
            else
              if [ -n "${PREV}" ]; then
                echo "### What changed since ${PREV}"
              else
                echo "### What changed"
              fi
              echo ""
              cat changelog.md
            fi

            if [ -n "${PREV}" ]; then
              echo ""
              echo "**Full changelog:** ${REPO_URL}/compare/${PREV}...${TAG}"
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Tidy ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/**/*
          # Off: the changelog above is composed from `git log` in the previous
          # step. GitHub's generator needs a *published* previous release to
          # diff against and quietly produces nothing when it cannot find one,
          # which is why tagged releases were going out with only the download
          # table on them.
          generate_release_notes: false
          draft: false
          # A prerelease is invisible to the updater unless the app was built
          # with TIDY_UPDATE_PRERELEASE=true, so shipping one by accident would
          # look like the release simply never arrived.
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Build summary
    runs-on: ubuntu-latest
    needs: [prepare, build-macos]
    if: always()
    steps:
      - name: Write summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
        run: |
          {
            echo "## 🧹 Tidy — \`${VERSION}\`"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Build | ${MACOS_RESULT} |"
            echo "| Signing | ad-hoc (unsigned, not notarized) |"
            echo ""
            echo "> 💡 Actions tab → this run → **Artifacts** to download the DMG."
          } >> "$GITHUB_STEP_SUMMARY"
